<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
   <meta charset="utf-8">
   <title>Virtual Piano</title>
   <link rel="stylesheet" href="style.css">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="icon" href="pianologo.ico" type="image/x-icon">
</head>
<body> <!-- Body starts here -->

<div class="wrapper"> <!-- This div is called the wrapper -->
    <header>
        <h2>Virtual Piano</h2> <!-- The title that is visible on the website -->
        <div class="column volume-slider">
            <span>Volume</span> <input type="range">
        </div>
        <div class="column showKeys-checkBox"> <!-- Show keys checkbox -->
            <span>Show Keys</span> <input type="checkbox" checked>
        </div>
    </header>
    <ul class="piano-keys"> <!-- Piano keys -->
        <li class="key white"><span>q</span></li>
        <li class="key black"><span>w</span></li>
        <li class="key white"><span>e</span></li>
        <li class="key black"><span>r</span></li>
        <li class="key white"><span>t</span></li>
        <li class="key black"><span>y</span></li>
        <li class="key white"><span>u</span></li>
        <li class="key black"><span>i</span></li>
        <li class="key white"><span>o</span></li>
        <li class="key black"><span>p</span></li>
        <li class="key white"><span>a</span></li>
        <li class="key black"><span>s</span></li>
        <li class="key white"><span>d</span></li>
        <li class="key black"><span>f</span></li>
        <li class="key white"><span>g</span></li>
        <li class="key black"><span>h</span></li>
        <li class="key white"><span>j</span></li>
    </ul>
</div>


   
</body> <!-- Body ends here -->
</html>
